name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Hopline.js 与 src/ 同步
        run: node build.mjs --check
      - name: 语法检查
        run: node --check Hopline.js
      - name: 静态检查（eslint）
        run: npm run lint
      - name: 测试
        run: node --test
